name: test-gzip-backend-per-arch

on:
  push:
    branches: [test-gzip-backend-per-arch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - if: runner.os == 'macOS'
      run: brew install pigz pbzip2 isa-l zstd lz4
    - if: runner.os == 'Linux'
      run: sudo apt-get install -y pigz pbzip2 isal zstd lz4
    - uses: actions/checkout@v7
      with:
        repository: ptweezy/xopen
        ref: gzip-backend-per-arch
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        allow-prereleases: true
    - run: python -m pip install tox
    - name: Tests with python-isal (and python-zlib-ng where xopen installs it)
      run: |
        tox run -e 3.15
        .tox/3.15/bin/python -c "import xopen, platform; print(platform.machine(), 'isal' if xopen.igzip else 'no-isal', 'zlib-ng' if xopen.gzip_ng else 'no-zlib-ng', 'isal reads:', xopen._ISAL_DECOMPRESSES_FASTEST)"
    - name: Tests without python-isal and python-zlib-ng
      run: tox run -e no-libs
