name: bench-isal-macos-arm64

on:
  push:
    branches: [bench-isal-macos-arm64]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backends:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Benchmark gzip backends
      run: |
        python -m pip install -q isal==1.9.1 zlib-ng==1.1.0
        python bench/backends.py
